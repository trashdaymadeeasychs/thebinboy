name: Deploy to Bluehost

on:
  push:
    branches:
      - claude/redesign-binboy-website-vCsMz
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluehost-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/claude/redesign-binboy-website-vCsMz'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out website
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # Full history so the sitemap can use each page's last change date.
          fetch-depth: 0

      - name: Check website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          node --check script.js

      - name: Deploy and verify website files
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BLUEHOST_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" |
            tr -d '\r' > "$HOME/.ssh/bluehost_key"

          printf '%s\n' "$SSH_KNOWN_HOSTS" |
            tr -d '\r' > "$HOME/.ssh/bluehost_hosts"

          chmod 600 "$HOME/.ssh/bluehost_key" "$HOME/.ssh/bluehost_hosts"

          ssh-keygen -y -P "" \
            -f "$HOME/.ssh/bluehost_key" > /dev/null

          ssh-keygen -F 162.241.224.92 \
            -f "$HOME/.ssh/bluehost_hosts" > /dev/null

          site_dir=$(mktemp -d "$RUNNER_TEMP/binboy-site.XXXXXX")

          cp *.html styles.css script.js robots.txt sitemap.xml "$site_dir/"
          cp -R images "$site_dir/"

          # Date each sitemap entry from the page's last git change.
          python3 scripts/sitemap_lastmod.py "$site_dir/sitemap.xml"

          # Give styles.css and script.js a new URL on every deploy so no
          # browser or CDN cache can keep serving an old copy with new HTML.
          asset_version="${GITHUB_SHA:0:12}"
          sed -i \
            -e "s#href=\"styles.css\"#href=\"styles.css?v=${asset_version}\"#" \
            -e "s#src=\"script.js\"#src=\"script.js?v=${asset_version}\"#" \
            "$site_dir"/*.html
          for page in "$site_dir"/*.html; do
            grep -q "href=\"styles.css?v=${asset_version}\"" "$page"
            grep -q "src=\"script.js?v=${asset_version}\"" "$page"
          done

          ssh_options=(
            -i "$HOME/.ssh/bluehost_key"
            -p 22
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/bluehost_hosts"
            -o ConnectTimeout=20
          )

          remote_script=$(cat <<'REMOTE'
          set -eu
          umask 022

          docroot=/home4/thebinbo/public_html
          cd "$docroot"

          backup_dir="$HOME/github_binboy_backups"
          mkdir -p "$backup_dir"

          backup="$backup_dir/site-$(date -u +%Y%m%dT%H%M%SZ)-$$.tar.gz"

          (
            umask 077
            tar -czf "$backup" -- \
              *.html styles.css script.js robots.txt sitemap.xml images
          )

          tar -tzf "$backup" > /dev/null

          stage=$(mktemp -d "$HOME/.binboy-stage.XXXXXX")
          trap 'rm -rf "$stage"' EXIT

          tar -xf - -C "$stage"

          test -s "$stage/index.html"
          test -s "$stage/pricing.html"
          test -s "$stage/styles.css"

          expected_hashes=$(
            cd "$stage"
            find . -type f -exec sha256sum {} +
          )

          test -n "$expected_hashes"

          cp -R "$stage/." "$docroot/"

          (
            cd "$docroot"
            printf '%s\n' "$expected_hashes" | sha256sum -c -
          )

          # Serve the branded 404 page with a real 404 status. Never replace
          # Bluehost's existing .htaccess: back it up, then append the one line
          # only if it is missing.
          htaccess="$docroot/.htaccess"
          error_rule='ErrorDocument 404 /404.html'
          if ! grep -qxF "$error_rule" "$htaccess" 2>/dev/null; then
            if [ -f "$htaccess" ]; then
              cp "$htaccess" \
                "$backup_dir/htaccess-$(date -u +%Y%m%dT%H%M%SZ)-$$"
            fi
            printf '\n%s\n' "$error_rule" >> "$htaccess"
            echo "Added 404 rule to .htaccess."
          fi

          echo "Uploaded files match the deployment package."
          echo "Backup saved outside public_html."
          REMOTE
          )

          tar -C "$site_dir" -cf - . |
            ssh "${ssh_options[@]}" \
              thebinbo@162.241.224.92 "$remote_script"

          echo "Website files deployed and checksum-verified over SSH." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Check public pricing page
        shell: bash
        run: |
          set -euo pipefail

          http_status=$(curl --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
            --write-out '%{http_code}' \
            "https://thebinboy.com/pricing.html?deploy=$GITHUB_SHA" \
            -o "$RUNNER_TEMP/live-pricing.html")

          if [ "$http_status" = "403" ]; then
            echo "::warning::Public HTTP verification received 403. Uploaded files were verified over SSH."
            echo "Public HTTP access could not be verified because the request received 403." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$http_status" != "200" ]; then
            echo "::error::Live pricing page returned HTTP $http_status"
            exit 1
          fi

          python3 - "$RUNNER_TEMP/live-pricing.html" <<'PY'
          from pathlib import Path
          import sys

          html = Path(sys.argv[1]).read_text()

          assert html.count('pricing-card__extra') == 5, \
              "Live page does not show all five updated pricing cards"

          assert html.count('Additional bins are $15 per bin') >= 5, \
              "Live page is missing additional-bin pricing"

          print("Live pricing page verified.")
          PY

          asset_version="${GITHUB_SHA:0:12}"
          grep -q "styles.css?v=${asset_version}" "$RUNNER_TEMP/live-pricing.html" || {
            echo "::error::Live pricing page does not reference this deploy's stylesheet"
            exit 1
          }

          curl --silent --show-error --fail --location \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
            "https://thebinboy.com/styles.css?v=${asset_version}" \
            -o "$RUNNER_TEMP/live-styles.css"

          if ! cmp -s styles.css "$RUNNER_TEMP/live-styles.css"; then
            echo "::error::Live styles.css does not match this commit"
            exit 1
          fi

          echo "Live stylesheet matches this commit." >> "$GITHUB_STEP_SUMMARY"

          echo "Public pricing page verification passed." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Remove deployment credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/bluehost_key" "$HOME/.ssh/bluehost_hosts"
